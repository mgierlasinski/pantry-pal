name: Dotnet Setup
description: Configure .NET SDK and optional workloads
inputs:
  dotnet-version:
    description: .NET SDK version specification
    required: true
  install-maui:
    description: Install MAUI workload (true/false)
    required: false
    default: 'false'
  maui-platform:
    description: MAUI platform to install (android/ios/windows/maccatalyst)
    required: false
runs:
  using: composite
  steps:
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: ${{ inputs.dotnet-version }}
        cache: false
    - name: Install MAUI workload
      if: ${{ inputs.install-maui == 'true' }}
      shell: pwsh
      run: |
        if ("${{ inputs.maui-platform }}" -eq "android") {
          dotnet workload install maui-android
        } elseif ("${{ inputs.maui-platform }}" -eq "ios") {
          dotnet workload install maui-ios
        } elseif ("${{ inputs.maui-platform }}" -eq "windows") {
          dotnet workload install maui-windows
        } elseif ("${{ inputs.maui-platform }}" -eq "maccatalyst") {
          dotnet workload install maui-maccatalyst
        } else {
          dotnet workload install maui
        }

