name: Deploy API

on:
  workflow_dispatch:

env:
  DOTNET_VERSION: 9.0.x
  IMAGE_NAME: ${{ github.repository_owner }}/pantry-pal-api

jobs:
  build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: ./.github/actions/dotnet-setup
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore tests/PantryPal.Api.UnitTests/PantryPal.Api.UnitTests.csproj

      - name: Run unit tests
        run: dotnet test tests/PantryPal.Api.UnitTests/PantryPal.Api.UnitTests.csproj --configuration Release --no-restore

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/PantryPal.Api/Dockerfile
          push: true
          tags: ghcr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}

