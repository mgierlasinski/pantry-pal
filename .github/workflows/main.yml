name: Test and Publish

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  DOTNET_VERSION: 9.0.x

jobs:
  api:
    name: API Pipeline
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET SDK
        uses: ./.github/actions/dotnet-setup
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore PantryPal.sln

      - name: Run unit tests
        run: dotnet test tests/PantryPal.Api.UnitTests/PantryPal.Api.UnitTests.csproj --configuration Release --no-restore

      - name: Publish API
        run: dotnet publish src/PantryPal.Api/PantryPal.Api.csproj --configuration Release --output out/api --no-restore

      - name: Upload API artifact
        uses: actions/upload-artifact@v5
        with:
          name: pantry-pal-api
          path: out/api

  android:
    name: Android Pipeline
    runs-on: windows-latest
    needs: api
    env:
      MAUI_TARGET_FRAMEWORK: net9.0-android
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET SDK with MAUI
        uses: ./.github/actions/dotnet-setup
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          install-maui: 'true'

      - name: Restore dependencies
        run: dotnet restore PantryPal.sln

      - name: Run unit tests
        run: dotnet test tests/PantryPal.Mobile.UnitTests/PantryPal.Mobile.UnitTests.csproj --configuration Release --no-restore

      - name: Publish Android app
        run: dotnet publish src/PantryPal.Mobile/PantryPal.Mobile.csproj -f ${{ env.MAUI_TARGET_FRAMEWORK }} --configuration Release --output out/android --no-restore

      - name: Upload Android artifact
        uses: actions/upload-artifact@v5
        with:
          name: pantry-pal-android
          path: out/android

