name: Release Mobile App

on:
  workflow_dispatch:

env:
  DOTNET_VERSION: 9.0.x
  MAUI_TARGET_FRAMEWORK: net9.0-android

jobs:
  release:
    name: Build and Release Mobile App
    runs-on: windows-latest
    environment: production
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET SDK with MAUI
        uses: ./.github/actions/dotnet-setup
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          install-maui: 'true'
          maui-platform: 'android'

      - name: Set environment specific variables
        shell: pwsh
        run: |
          $mauiLaunchSettings = "src\PantryPal.Mobile\Properties\MauiLaunchSettings.cs"
          (Get-Content $mauiLaunchSettings) -replace '"Development"', '"${{ vars.MOBILE_ENVIRONMENT }}"' | Set-Content $mauiLaunchSettings
          
          $appSettings = "src\PantryPal.Mobile\appsettings.json"
          (Get-Content $appSettings) -replace '"AnonKey": ""', '"AnonKey": "${{ secrets.MOBILE_AUTH_KEY }}"' | Set-Content $appSettings

      - name: Restore dependencies
        run: dotnet restore PantryPal.sln

      - name: Run unit tests
        run: dotnet test tests/PantryPal.Mobile.UnitTests/PantryPal.Mobile.UnitTests.csproj --configuration Release --no-restore

      - name: Publish Android app
        run: dotnet publish src/PantryPal.Mobile/PantryPal.Mobile.csproj -f ${{ env.MAUI_TARGET_FRAMEWORK }} --configuration Release --output out/android --no-restore

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: release-${{ github.run_number }}
          release_name: Mobile App Release #${{ github.run_number }}
          draft: false
          prerelease: false

      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./out/android/com.pantrypal.mobile-Signed.apk
          asset_name: com.pantrypal.mobile.apk
          asset_content_type: application/vnd.android.package-archive
